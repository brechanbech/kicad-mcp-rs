[workspace]
resolver = "3"
members = [
    "crates/kicad-access",
    "crates/kicad-checks",
    "crates/kicad-mcp-server",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://codeberg.org/brechanbech/kicad-mcp-rs"
authors = ["Stefan Ractliffe"]

# Shared dependency versions. Crates opt in via `dep.workspace = true`.
[workspace.dependencies]
# --- MCP ---
rmcp = { version = "3", features = ["server", "macros", "transport-io"] }

# --- KiCad access (optional, behind features in kicad-access) ---
kicad-ipc-rs = "0.5"   # live IPC client (needs a running KiCad / kicad-cli api-server)
kiutils-rs = "0.2"     # pure-Rust S-expression parsing for headless file ops
# Headless .kicad_sch read/edit (annotate, bulk property edits, wire routing). Public on
# Codeberg, so it resolves anonymously for both local builds and CI.
kicad-sch-rs = { git = "https://codeberg.org/brechanbech/kicad-sch-rs.git" }

# --- async / runtime ---
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "process", "signal", "fs"] }

# --- (de)serialization & schema ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

# --- errors / logging ---
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Internal crates
kicad-access = { path = "crates/kicad-access", version = "0.2.0" }
kicad-checks = { path = "crates/kicad-checks", version = "0.2.0" }

# M-STATIC-VERIFICATION: workspace-wide lint policy, inherited per-crate via `[lints] workspace = true`.
[workspace.lints.rust]
# This project reaches KiCad over IPC / files / CLI — there is no reason to write
# `unsafe`, so forbid it outright (stronger than `deny`: an inner `allow` can't undo it).
unsafe_code = "forbid"
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# This project has no business doing anything unsafe; KiCad access is all IPC/file/CLI.
undocumented_unsafe_blocks = "warn"

# Faster, debuggable benches/profiles if you add criterion later (M-HOTPATH).
[profile.release]
debug = "line-tables-only"
