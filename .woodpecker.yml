# Codeberg CI (Woodpecker). Activate the repo at https://ci.codeberg.org to run this.
#
# Covers the headless path — the default (cli) build and `--features files` — which
# need no KiCad install. The `ipc` backend is intentionally not built here: it pulls
# nng-sys (needs cmake) and can only be exercised against a running KiCad GUI, so it
# is validated locally via the #[ignore]d `live_version` test instead.

when:
  - event: [push, pull_request]

steps:
  - name: check
    image: rust:latest
    environment:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-D warnings"
    commands:
      - rustup component add rustfmt clippy
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets -- -D warnings
      - cargo clippy --workspace --all-targets --features kicad-mcp-server/files -- -D warnings
      - cargo test --workspace
      - cargo test -p kicad-access --features files
      # Compiles the kicad-cli-gated e2e test; it skips at runtime when kicad-cli is absent.
      - cargo test -p kicad-mcp-server --features files

  - name: deny
    image: rust:latest
    commands:
      - cargo install cargo-deny --locked
      - cargo deny check
